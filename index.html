<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Downloader</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }
        .container {
            background-color: #2c2c2e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            margin: auto 0; 
        }
        h2 { margin-bottom: 10px; color: #0a84ff; }
        .status { font-size: 16px; margin: 20px 0; color: #eaeaea; }
        .timer { font-size: 24px; font-weight: bold; color: #ff9f0a; }
        .btn {
            display: none;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-smartlink { background-color: #ff9f0a; color: white; }
        .btn-final { background-color: #30d158; color: white; }

        /* POPUP MODAL OVERLAY */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .ad-modal-card {
            background: #ffffff;
            color: #0f172a;
            border-radius: 20px;
            padding: 18px 16px;
            max-width: 320px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .popup-top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-height: 28px;
            margin-bottom: 8px;
        }
        .popup-timer-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .timer-ring-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #cbd5e1;
            border-top-color: #0284c7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .popup-skip-btn {
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .popup-skip-btn:hover, .popup-skip-btn:active {
            background: #e2e8f0;
            transform: scale(0.96);
        }
        .popup-product-img {
            width: 100%;
            max-height: min(180px, 32vh);
            object-fit: contain;
            border-radius: 12px;
            margin: 4px auto 14px auto;
            display: block;
            background: #f8fafc;
        }
        .popup-product-title {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.35;
            margin-bottom: 6px;
        }
        .popup-brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 16px;
        }
        .popup-cta-btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            transition: transform 0.15s, background 0.15s;
        }
        .popup-cta-btn:active {
            transform: scale(0.98);
            background: #0369a1;
        }
    </style>
</head>
<body>

<!-- CUSTOM AFFILIATE POPUP AD (10s SKIP LOCK) -->
<div id="affiliate-popup-modal" class="modal-overlay" style="display: none;">
  <div class="ad-modal-card">
    <div class="popup-top-bar">
      <!-- Timer pill while countdown runs -->
      <div id="popup-timer-badge" class="popup-timer-pill" style="display: inline-flex;">
        <div class="timer-ring-spinner"></div>
        <span>Skip in <b id="popup-countdown-sec">10</b>s</span>
      </div>
      <!-- Skip button when unlocked -->
      <button id="popup-skip-action-btn" class="popup-skip-btn" style="display: none;" onclick="closeAffiliatePopupAd()">
        Skip ✕
      </button>
    </div>

    <!-- Product Creative Image -->
    <img id="popup-img" class="popup-product-img" src="" alt="Affiliate Product" onclick="handlePopupAdCtaClick()" style="cursor: pointer;" />

    <!-- Title & Headline -->
    <div id="popup-title" class="popup-product-title">Featured Offer</div>

    <!-- Brand / Store Attribution -->
    <div class="popup-brand-badge">
      <span id="popup-brand-icon">🛒</span>
      <span id="popup-brand-name">Affiliate Store Partner</span>
    </div>

    <!-- CTA Button -->
    <button id="popup-cta-button" class="popup-cta-btn" onclick="handlePopupAdCtaClick()">
      See Product
    </button>
  </div>
</div>

<div class="container">
    <h2>File Downloader</h2>
    <p style="color: #aaa; font-size: 14px;">Complete the step to get your file</p>
    
    <div id="timer-section" class="status">
        Checking secure link... <br>
        <span id="countdown" class="timer">20</span> seconds
    </div>

    <button id="smartlink-btn" class="btn btn-smartlink" onclick="triggerPopkornAd()">🔓 Unlock Your File</button>

    <button id="final-btn" class="btn btn-final" onclick="redirectToBot()">📥 Get File (Back to Bot)</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e) {}

    // 1. Firebase Realtime Database Config & Initialization
    const firebaseConfig = {
      databaseURL: "https://popkornflix-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. Redirect Links State & Rotation Engine
    let activeRedirectUrls = [];
    let defaultRedirectUrl = localStorage.getItem('_pk_default_redirect_url') || 'https://t.me/Hotpopkornbot';

    // Instant local cache initialization for zero latency
    try {
      const cached = localStorage.getItem('_pk_download_redirects');
      if (cached) {
        const val = JSON.parse(cached);
        if (val && typeof val === 'object') {
          activeRedirectUrls = Object.values(val).filter(item => item && item.url && item.active !== false);
        }
      }
    } catch(e) {}

    // Realtime listeners from Firebase
    db.ref('settings/download_redirects').on('value', snapshot => {
      const val = snapshot.val();
      if (val && typeof val === 'object') {
        try { localStorage.setItem('_pk_download_redirects', JSON.stringify(val)); } catch(e) {}
        activeRedirectUrls = Object.values(val).filter(item => item && item.url && item.active !== false);
      } else {
        activeRedirectUrls = [];
      }
    }, err => {
      console.warn('Firebase download_redirects read error:', err.message);
    });

    db.ref('settings/active_redirect_url').on('value', snapshot => {
      const url = snapshot.val();
      if (url && typeof url === 'string') {
        defaultRedirectUrl = url;
        try { localStorage.setItem('_pk_default_redirect_url', url); } catch(e) {}
      }
    });

    function getSelectedRedirectUrl() {
      if (activeRedirectUrls.length > 0) {
        const randomIndex = Math.floor(Math.random() * activeRedirectUrls.length);
        const selected = activeRedirectUrls[randomIndex];
        if (selected.id) {
          db.ref('settings/download_redirects/' + selected.id + '/clicks').transaction(c => (c || 0) + 1).catch(() => {});
        }
        return selected.url;
      }
      return defaultRedirectUrl;
    }

    function normalizeAdUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      let trimmed = rawUrl.trim();
      if (!trimmed || trimmed === '#') return '';
      if (/^https?:\/\//i.test(trimmed)) {
        return trimmed;
      }
      trimmed = trimmed.replace(/^\/+/, '');
      return 'https://' + trimmed;
    }

    function openTelegramUrlSafely(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return;
      let tmeUrl = rawUrl.trim();
      if (!tmeUrl) return;

      if (tmeUrl.startsWith('tg://resolve?domain=')) {
        const queryPart = tmeUrl.slice('tg://resolve?domain='.length);
        const [domainPart, ...extra] = queryPart.split('&');
        const searchPart = extra.length > 0 ? '?' + extra.join('&') : '';
        tmeUrl = 'https://t.me/' + domainPart + searchPart;
      } else if (tmeUrl.startsWith('tg://join?invite=')) {
        tmeUrl = 'https://t.me/+' + tmeUrl.slice('tg://join?invite='.length);
      } else if (tmeUrl.startsWith('@')) {
        tmeUrl = 'https://t.me/' + tmeUrl.slice(1);
      }

      if (!/^https?:\/\//i.test(tmeUrl) && !/^tg:\/\//i.test(tmeUrl)) {
        tmeUrl = 'https://' + tmeUrl;
      }

      const isTgWebApp = !!(window.Telegram && window.Telegram.WebApp && (window.Telegram.WebApp.initData || window.Telegram.WebApp.platform !== 'unknown'));

      if (isTgWebApp) {
        const tgApp = window.Telegram.WebApp;
        if (typeof tgApp.openTelegramLink === 'function') {
          try {
            tgApp.openTelegramLink(tmeUrl);
            return;
          } catch (e) {}
        }
        if (typeof tgApp.openLink === 'function') {
          try {
            tgApp.openLink(tmeUrl, { try_instant_view: false });
            return;
          } catch (e) {}
        }
        window.location.href = tmeUrl;
        return;
      }

      try {
        window.open(tmeUrl, '_blank', 'noopener,noreferrer');
      } catch (e) {
        window.location.href = tmeUrl;
      }
    }

    function openAffiliateTargetUrl(rawUrl) {
      const finalUrl = normalizeAdUrl(rawUrl);
      if (!finalUrl) return false;

      // 1. If target is a Telegram link, route through dedicated Telegram opener
      if (/^(?:https?:\/\/(?:[a-zA-Z0-9_-]+\.)?(?:t|telegram)\.(?:me|dog|org)(?:[\/?#]|$)|tg:)/i.test(finalUrl)) {
        openTelegramUrlSafely(finalUrl);
        return true;
      }

      // 2. Inside Telegram WebApp:
      // Always use Telegram's official openLink API with { try_browser: 'chrome' }
      if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openLink === 'function') {
        try {
          window.Telegram.WebApp.openLink(finalUrl, { try_browser: 'chrome', try_instant_view: false });
          return true;
        } catch (e) {
          try {
            window.Telegram.WebApp.openLink(finalUrl);
            return true;
          } catch (err2) {}
        }
      }

      // 3. Regular browser fallback
      try {
        const newWin = window.open(finalUrl, '_blank', 'noopener,noreferrer');
        if (!newWin || newWin.closed || typeof newWin.closed === 'undefined') {
          window.location.href = finalUrl;
          return false;
        }
        return true;
      } catch (e) {
        window.location.href = finalUrl;
        return false;
      }
    }

    // -------------------------------------------------------------
    // 3. POPUP ADS ENGINE (Instant Display with 10s Skip Lock)
    // -------------------------------------------------------------
    let loadedPopupAds = [];
    let currentActivePopupAd = null;
    let popupSkipTimer = null;
    let hasShownPopupAd = false;

    // Load cached popup ads for zero-latency instant display
    try {
      const cachedAds = localStorage.getItem('_pk_bot_popup_ads');
      if (cachedAds) {
        loadedPopupAds = JSON.parse(cachedAds) || [];
      }
    } catch(e) {}

    function processIncomingAds(rawAds) {
      if (!rawAds || typeof rawAds !== 'object') return;
      const list = [];
      Object.entries(rawAds).forEach(([id, ad]) => {
        if (ad && ad.type === 'popup' && ad.active !== false) {
          list.push({ id, ...ad });
        }
      });
      if (list.length > 0) {
        loadedPopupAds = list;
        try { localStorage.setItem('_pk_bot_popup_ads', JSON.stringify(list)); } catch(e) {}
        if (!hasShownPopupAd) {
          triggerPopupAd();
        }
      }
    }

    db.ref('analytics/ad_system/ads').on('value', snap => processIncomingAds(snap.val()));
    db.ref('ads').on('value', snap => processIncomingAds(snap.val()));

    function pickWeightedAd(adList) {
      if (!adList || adList.length === 0) return null;
      if (adList.length === 1) return adList[0];

      const pool = [];
      adList.forEach(ad => {
        const weight = Math.max(1, parseInt(ad.priority) || 5);
        for (let i = 0; i < weight; i++) {
          pool.push(ad);
        }
      });

      const randomIndex = Math.floor(Math.random() * pool.length);
      return pool[randomIndex];
    }

    function triggerPopupAd() {
      if (hasShownPopupAd || loadedPopupAds.length === 0) return;
      currentActivePopupAd = pickWeightedAd(loadedPopupAds);
      if (!currentActivePopupAd) return;
      hasShownPopupAd = true;

      const modal = document.getElementById('affiliate-popup-modal');
      const img = document.getElementById('popup-img');
      const title = document.getElementById('popup-title');
      const brand = document.getElementById('popup-brand-name');
      const ctaBtn = document.getElementById('popup-cta-button');
      const timerBadge = document.getElementById('popup-timer-badge');
      const countdownSec = document.getElementById('popup-countdown-sec');
      const skipBtn = document.getElementById('popup-skip-action-btn');

      if (img) img.src = currentActivePopupAd.image_url || '';
      if (title) title.innerText = currentActivePopupAd.title || 'Featured Offer';
      if (brand) brand.innerText = currentActivePopupAd.brand_tag || 'Affiliate Partner';
      if (ctaBtn) ctaBtn.innerText = currentActivePopupAd.btn_text || 'See Product';

      if (timerBadge) timerBadge.style.display = 'inline-flex';
      if (skipBtn) skipBtn.style.display = 'none';
      if (countdownSec) countdownSec.innerText = '10';
      if (modal) modal.style.display = 'flex';

      // Track Impression in Firebase
      if (currentActivePopupAd.id) {
        db.ref('analytics/ad_system/ads/' + currentActivePopupAd.id + '/impressions').transaction(c => (c || 0) + 1).catch(() => {});
      }

      // 10-Second Skip Lock Timer
      let skipTime = 10;
      if (popupSkipTimer) clearInterval(popupSkipTimer);
      popupSkipTimer = setInterval(() => {
        skipTime--;
        if (countdownSec) countdownSec.innerText = skipTime;
        if (skipTime <= 0) {
          clearInterval(popupSkipTimer);
          popupSkipTimer = null;
          if (timerBadge) timerBadge.style.display = 'none';
          if (skipBtn) skipBtn.style.display = 'inline-flex';
        }
      }, 1000);
    }

    function closeAffiliatePopupAd() {
      if (popupSkipTimer) {
        clearInterval(popupSkipTimer);
        popupSkipTimer = null;
      }
      const modal = document.getElementById('affiliate-popup-modal');
      if (modal) modal.style.display = 'none';
    }

    function handlePopupAdCtaClick() {
      if (!currentActivePopupAd) return;
      const targetUrl = currentActivePopupAd.target_url || currentActivePopupAd.url;
      if (targetUrl) {
        if (currentActivePopupAd.id) {
          db.ref('analytics/ad_system/ads/' + currentActivePopupAd.id + '/clicks').transaction(c => (c || 0) + 1).catch(() => {});
        }
        openAffiliateTargetUrl(targetUrl);
      }
      closeAffiliatePopupAd();
    }

    // Trigger popup ad immediately if cached ads exist
    if (loadedPopupAds.length > 0) {
      triggerPopupAd();
    }

    // -------------------------------------------------------------
    // 4. MAIN 20-SECOND COUNTDOWN & UNLOCK LOGIC
    // -------------------------------------------------------------
    const BOT_USERNAME = "Hotpopkornbot"; 
    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('fid');

    // Timer ko 20 seconds kar diya gaya hai
    let timeLeft = 20;
    const countdownEl = document.getElementById('countdown');
    const timerSection = document.getElementById('timer-section');
    const smartlinkBtn = document.getElementById('smartlink-btn');
    const finalBtn = document.getElementById('final-btn');

    // 20 Second Timer Logic
    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.innerText = timeLeft;
        
        if (timeLeft <= 0) {
            clearInterval(timer);
            timerSection.style.display = 'none';
            smartlinkBtn.style.display = 'block'; 
        }
    }, 1000);

    // UNLOCK BUTTON CLICK LOGIC
    function triggerPopkornAd() {
        // 1. Fetch targeted redirect URL from rotation & open safely
        const redirectUrl = getSelectedRedirectUrl();
        if (redirectUrl) {
            openAffiliateTargetUrl(redirectUrl);
            try {
                db.ref('analytics/totals/download_redirect_clicks').transaction(c => (c || 0) + 1).catch(() => {});
            } catch(e) {}
        }

        // 2. Unlock the final Get File button
        smartlinkBtn.style.display = 'none'; 
        finalBtn.style.display = 'block';
    }

    // Bot me wapas redirect karne ke liye
    function redirectToBot() {
        if (fileId) {
            const redirectUrl = `https://t.me/${BOT_USERNAME}?start=getfile_${fileId}`;
            tg.openTelegramLink(redirectUrl);
            tg.close();
        } else {
            const redirectUrl = `https://t.me/${BOT_USERNAME}`;
            tg.openTelegramLink(redirectUrl);
            tg.close();
        }
    }
</script>

</body>
</html>
